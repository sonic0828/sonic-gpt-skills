<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏资产库</title>
<style>
:root {
  --paper:#f4f4f2; --panel:#ffffff; --ink:#232528; --accent:#445468; --stage:#ececea;
  --line:color-mix(in srgb,var(--ink) 18%,var(--panel));
  --muted:color-mix(in srgb,var(--ink) 72%,var(--panel));
  --wash:color-mix(in srgb,var(--accent) 12%,var(--panel));
  font:15px/1.5 "DM Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--paper); color:var(--ink)
}
*{box-sizing:border-box}body,figure,h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}button,summary,select{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a,.mode,.gallery figcaption{color:var(--accent)}a,.detail,.card{overflow-wrap:anywhere}
main{max-width:1700px;margin:auto;padding:0 clamp(16px,3vw,52px) 36px}
.head{display:flex;align-items:center;justify-content:space-between;padding:23px 0 17px;gap:20px}
.mode,.totals,.id,#count,figcaption,.ref,.coverage,.filter,.more{font-size:13px}
.mode{font-weight:700}.head h1{font-size:clamp(26px,3vw,42px);letter-spacing:-.045em}
.totals,.id,#count,.coverage,.ref code,.card small,.empty{color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.find input{border:0;background:transparent;width:clamp(150px,20vw,300px)}input::placeholder{color:var(--muted)}
nav{display:flex;align-items:center;gap:12px;border-block:1px solid var(--line);padding:9px 0;flex-wrap:wrap}#filters{display:flex;gap:5px;flex-wrap:wrap}
.filter,.more{background:transparent;color:var(--ink);border:1px solid transparent;border-radius:6px;padding:6px 10px}
.more{background:var(--panel);border-color:var(--line);max-width:100%}
.filter small{padding-left:7px;opacity:.8}.filter[aria-pressed=true],.card[aria-current=true]{background:var(--wash);border-color:var(--accent)}
.coverage{margin:0 0 0 auto}.coverage[open]{flex-basis:100%}.coverage p{max-width:100ch;margin:8px 0;white-space:pre-wrap}
.workspace{display:grid;align-items:start;grid-template-columns:minmax(215px,1fr) minmax(0,2.5fr);gap:clamp(16px,2.5vw,40px);margin-top:20px}
.inventory,.detail{min-width:0}.inventory header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.inventory h2{font-size:17px}.cards{display:grid;gap:6px;max-height:70vh;overflow:auto;padding:2px;scrollbar-width:thin}
.card{min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px;text-align:left}
.card:hover,.filter:hover{border-color:var(--accent)}.card strong,.card small{display:block}.card strong{font-size:14px}.card small{font-size:12px}
.thumb{display:grid;place-items:center;flex:0 0 50px;height:50px;background:var(--stage);overflow:hidden;border-radius:5px}
.thumb img,.thumb canvas,.media img,.media canvas,.media video{width:100%;height:100%;min-height:0;object-fit:contain}
.detail{padding:clamp(16px,2vw,30px);border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.detail h2{font-size:clamp(23px,2.6vw,36px);line-height:1.3;letter-spacing:-.035em}.id,.path,.ref code{font:12px/1.55 ui-monospace,monospace}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px}.warn,.error{color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-top:12px}
.gallery figure{background:var(--stage);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.gallery figcaption{background:var(--panel);border-top:1px solid var(--line);padding:7px 12px}
.media{height:clamp(170px,27vh,300px);padding:12px;display:grid;place-items:center}.media audio{max-width:100%}
.detail section{margin-top:16px}.detail h3{font-size:14px;margin-bottom:5px}.ref{border-top:1px solid var(--line);padding:6px 0}.ref strong,.ref code{display:block}.note{white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* Atlas: the selected board occupies the main stage; browse neighboring layouts as contact sheets. */
[data-layout=atlas] .workspace{grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr);grid-template-areas:"detail inventory"}
[data-layout=atlas] .inventory{grid-area:inventory}
[data-layout=atlas] .detail{grid-area:detail}
[data-layout=atlas] .cards{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));max-height:74vh}
[data-layout=atlas] .card{flex-direction:column;align-items:stretch;gap:5px}
[data-layout=atlas] .thumb{flex:auto;height:80px;padding:4px}
[data-layout=atlas] .card small,[data-layout=compare] .card small{display:none}
[data-layout=atlas] .media{height:clamp(245px,38vh,440px)}
/* Compare: a horizontal contact strip leaves the width of the page to the selected states. */
[data-layout=compare] .workspace{display:block}
[data-layout=compare] .cards{display:flex;overflow-x:auto;min-height:0;padding-bottom:5px}
[data-layout=compare] .card{flex:0 0 90px;flex-direction:column;text-align:center;gap:3px}
[data-layout=compare] .thumb{height:50px;width:100%;flex:auto;background:transparent}
[data-layout=compare] .detail{margin-top:14px;border-radius:12px}
[data-layout=compare] .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
[data-layout=compare] .gallery figure:only-child{grid-column:1/-1}
[data-layout=compare] .media{height:clamp(180px,26vh,350px)}
@media(max-width:760px){
  .head{flex-wrap:wrap;gap:10px}.workspace,[data-layout=atlas] .workspace{display:flex;flex-direction:column}
  .inventory,.detail{width:100%}.coverage{margin-left:0}.cards,[data-layout=atlas] .cards{max-height:190px}
  [data-layout=compare] .gallery{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
  [data-layout=compare] .media{height:170px}.thumb{height:42px;flex-basis:42px}
}
[data-layout=atlas] .gallery figure:first-child{grid-column:1/-1}
/* Give full UI screens room to read. Small components keep the compact comparison grid. */
.detail .gallery:has(.screen-preview){grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));align-items:start}
.gallery .screen-preview.landscape{grid-column:1/-1}
.gallery .screen-preview.portrait{width:100%;max-width:440px}
.detail .screen-preview .media{height:auto;padding:6px;display:block}
.screen-preview .media :is(img,canvas){display:block;width:100%;height:auto}
.screen-preview figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.screen-preview figcaption a{white-space:nowrap}
/*__structures.css__*/
</style>
</head>
<body>
<main><header class="head"><div><p class="mode" id="mode"></p><h1 id="title"></h1><p class="totals" id="totals"></p></div><label class="find"><span aria-hidden="true">⌕</span><span class="sr">搜索资产</span><input id="search" type="search" placeholder="在分类中搜索名称、场景、来源…" autocomplete="off"></label></header>
<nav aria-label="资产分类"><div id="filters"></div><details class="coverage"><summary>盘点范围</summary><p id="coverage"></p></details></nav>
<div class="workspace"><section class="inventory"><header><h2 id="group">全部资产</h2><span id="count" aria-live="polite"></span></header><div id="cards" class="cards"></div></section><article id="detail" class="detail" aria-label="资产详情"></article></div></main>
<script id="kit-data" type="application/json">/*__KIT_DATA__*/</script>
<script>
"use strict";
const {root, manifest, view} = JSON.parse(document.getElementById("kit-data").textContent);
const {items, files} = manifest;
document.documentElement.dataset.layout = view.layout || "catalog";
for (const [role,color] of Object.entries(view.colors || {})) {
  document.documentElement.style.setProperty("--" + role,color);
}
const structure = view.structure || "";
document.documentElement.dataset.structure = structure;
const evidence = {used:"已定位用法", file:"仅发现文件", visual:"画面可见"};
const statusNames = {added:"新增", changed:"变更", unchanged:"未变", removed:"退出盘点", missing:"来源缺失"};
const $ = id => document.getElementById(id);
function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
const assetName = item => item.manual.name || item.name;
const url = path => root + path.split("/").map(encodeURIComponent).join("/");
const mediaType = path => /\.(mp3|m4a|ogg|wav)$/i.test(path) ? "audio" : /\.(mp4|webm|mov)$/i.test(path) ? "video" : "img";
function loadImage(ref, box, onSize) {
  const img = new Image();
  img.alt = ref.preview;
  img.loading = "lazy";
  img.onerror = () => box.replaceChildren(el("span","图片未载入","error"));
  img.onload = () => {
    if (!ref.rect) {
      onSize?.(img.naturalWidth,img.naturalHeight);
      return;
    }
    const [x,y,w,h] = ref.rect;
    if (x+w > img.naturalWidth || y+h > img.naturalHeight) {
      box.replaceChildren(el("span","裁切超出原图","error"));
      return;
    }
    const scale = Math.min(1, (box.classList.contains("thumb") ? 128 : 1200) / Math.max(w,h));
    const canvas = el("canvas");
    canvas.width = Math.max(1,Math.round(w*scale));
    canvas.height = Math.max(1,Math.round(h*scale));
    canvas.setAttribute("aria-label",ref.preview);
    canvas.getContext("2d").drawImage(img,x,y,w,h,0,0,canvas.width,canvas.height);
    box.replaceChildren(canvas);
    onSize?.(w,h);
  };
  img.src = url(ref.path);
  box.append(img);
}
function reference(ref) {
  const row = el("div",undefined,"ref");
  if (ref.scene) row.append(el("strong",ref.scene));
  if (files[ref.path]) {
    const link = el("a",ref.path,"path");
    link.href = url(ref.path); link.target = "_blank"; link.rel = "noopener";
    row.append(link);
  } else row.append(el("span",ref.path + " · 文件缺失","error"));
  const position = [ref.locator,ref.rect && ("区域 [" + ref.rect.join(", ") + "]")].filter(Boolean);
  if (position.length) row.append(el("code",position.join(" · ")));
  return row;
}
function section(title,...children) {
  const group = el("section");
  group.append(el("h3",title),...children);
  return group;
}
function detail(item) {
  const pane = $("detail");
  pane.replaceChildren();
  if (!item) { pane.append(el("p","没有符合条件的条目。","empty")); return; }
  pane.append(el("p",item.category,"mode"),el("h2",assetName(item)),el("p",item.id,"id"));
  const tags = el("div",undefined,"tags");
  tags.append(el("span",evidence[item.evidence],"tag"),el("span",statusNames[item.status],
    ["missing","removed"].includes(item.status) ? "tag warn" : "tag"));
  const compactStates = view.layout === "compare" && item.states?.length && item.states.length <= 3;
  if (compactStates) tags.append(el("span",item.states.join(" / "),"tag"));
  pane.append(tags);
  const gallery = el("div",undefined,"gallery");
  const previews = item.sources.filter(s => s.preview && files[s.path]);
  const order = view.previewOrder?.[item.id];
  if (Array.isArray(order)) {
    const rank = ref => order.includes(ref.preview) ? order.indexOf(ref.preview) : order.length;
    previews.sort((a,b) => rank(a)-rank(b));
  }
  for (const ref of previews) {
    const figure = el("figure"), box = el("div",undefined,"media");
    const caption = el("figcaption",ref.preview);
    const type = mediaType(ref.path);
    if (type === "img") loadImage(ref,box,(width,height) => {
      if (manifest.mode !== "ui" || Math.min(width,height) < 240 || Math.max(width,height) < 420) return;
      figure.classList.add("screen-preview",width >= height ? "landscape" : "portrait");
      if (!ref.rect) {
        const link = el("a","查看原图 ↗");
        link.href = url(ref.path); link.target = "_blank"; link.rel = "noopener";
        link.setAttribute("aria-label","查看原图：" + ref.preview);
        caption.append(link);
      }
    });
    else {
      const player = el(type);
      player.src = url(ref.path); player.controls = true; player.preload = "none";
      player.setAttribute("aria-label",ref.preview);
      box.append(player);
    }
    figure.append(box,caption); gallery.append(figure);
  }
  if (gallery.childElementCount) pane.append(gallery);
  else pane.append(el("p","此条目可从下方来源定位。","totals"));
  if (item.states?.length && !compactStates) pane.append(section("状态",el("p",item.states.join("　/　"))));
  if (item.uses?.length) {
    const uses = section("使用场景",...item.uses.slice(0,2).map(reference));
    if (item.uses.length > 2) {
      const more = el("details");
      more.append(el("summary","查看其余 " + (item.uses.length-2) + " 处"),...item.uses.slice(2).map(reference));
      uses.append(more);
    }
    pane.append(uses);
  }
  pane.append(section("来源文件",...item.sources.map(reference)));
  if (Object.keys(item.attributes || {}).length) {
    const values = el("dl",undefined,"facts");
    for (const [label,value] of Object.entries(item.attributes)) values.append(el("dt",label),el("dd",value));
    pane.append(section("属性",values));
  }
  if (item.manual.note) pane.append(section("人工备注",el("p",item.manual.note,"note")));
}
let category = null, selected;
try { selected = decodeURIComponent(location.hash.slice(1)); } catch { selected = ""; }
const opening = items.find(i => i.id === (selected || view.focus) && i.status !== "removed");
if (opening) { selected = opening.id; category = ["05","06"].includes(structure) ? null : opening.category; }
const categories = new Map();
for (const item of items) categories.set(item.category,(categories.get(item.category)||0)+1);
const groups = structure === "03" ? Object.entries(view.groups || {}).filter(([,cats]) => cats.some(c => categories.has(c))) : [];
let scope = groups.find(([,cats]) => cats.includes(category))?.[0] || null;
function scopeCategories() { return groups.find(([name]) => name === scope)?.[1]; }
function filters() {
  $("filters").replaceChildren();
  const ordered = [...new Set([...(view.categories || []),...categories.keys()])].filter(k => categories.has(k));
  if (groups.length) {
    $("subcategories").replaceChildren();
    appendScopeFilters(ordered);
    return;
  }
  const main = ordered.slice(0,4);
  if (category && !main.includes(category)) main.push(category);
  for (const key of [null,...main]) {
    const count = key === null ? items.length : categories.get(key);
    const button = el("button",undefined,"filter");
    button.append(el("span",key ?? "全部资产"),el("small",count));
    button.setAttribute("aria-pressed",String(key === category));
    button.onclick = () => { category = key; filters(); list(); };
    $("filters").append(button);
  }
  if (ordered.length > 4) {
    const select = el("select",undefined,"more");
    select.setAttribute("aria-label","更多分类");
    select.add(new Option("更多分类…",""));
    for (const key of ordered.slice(4)) select.add(new Option(key,key));
    select.value = ordered.slice(4).includes(category) ? category : "";
    select.onchange = () => { category = select.value || null; filters(); list(); };
    $("filters").append(select);
  }
}
const searchIndex = new Map(items.map(i => [i.id, [i.id,i.name,assetName(i),i.manual.note,i.category,
  ...Object.entries(i.attributes || {}).flat(),...(i.states || []),...i.sources.flatMap(s => [s.path,s.locator,s.preview]),
  ...(i.uses || []).flatMap(u => [u.scene,u.path,u.locator])].filter(v => v != null && v !== "").join(" ").toLowerCase()]));
function choose(item) {
  selected = item.id;
  location.hash = encodeURIComponent(selected);
  for (const card of document.querySelectorAll("[data-item-id]")) card.setAttribute("aria-current",String(card.dataset.itemId === selected));
  detail(item);
  showSelection(item);
}
function list() {
  const query = $("search").value.trim().toLowerCase();
  const allowed = scopeCategories();
  const visible = items.filter(i => (!allowed || allowed.includes(i.category)) && (category === null || i.category === category) && searchIndex.get(i.id).includes(query));
  const current = visible.find(i => i.id === selected) || visible[0];
  selected = current?.id;
  $("cards").replaceChildren(); $("group").textContent = category ?? scope ?? "全部资产";
  $("count").textContent = visible.length + " 项";
  if (structure === "05") renderTable(visible);
  else for (const item of visible) {
    const card = el("button",undefined,"card"), thumb = el("span",undefined,"thumb");
    const preview = item.sources.find(s => s.preview && files[s.path] && mediaType(s.path) === "img");
    if (preview) loadImage(preview,thumb);
    else thumb.textContent = item.sources.some(s => s.preview) ? "▷" : "⌘";
    const words = el("span");
    words.append(el("strong",assetName(item)),el("small",item.category + " · " + evidence[item.evidence]));
    card.append(thumb,words); card.dataset.itemId = item.id;
    card.setAttribute("aria-current",String(item === current));
    card.onclick = () => choose(item); $("cards").append(card);
  }
  detail(current);
  if (!visible.length && structure === "04") $("cards").append(el("p","没有符合条件的条目。","empty"));
  if (structure === "06") { sceneIndex = sceneFor(current); renderScene(visible); }
  const strip = $("cards"), active = strip.querySelector('[aria-current="true"]');
  if (active && (structure === "01" || (!structure && view.layout === "compare"))) {
    strip.scrollLeft = active.offsetLeft - strip.offsetLeft - strip.clientWidth / 2 + active.offsetWidth / 2;
  }
}
$("title").textContent = manifest.project;
document.title = manifest.project + " · 资产工作台";
$("mode").textContent = view.label || (manifest.mode === "ui" ? "游戏 UI Kit" : "游戏资产库");
const active = items.filter(i => i.status !== "removed");
const activeFiles = new Set(active.flatMap(i => [...i.sources,...(i.uses || [])].map(r => r.path)).filter(p => files[p]));
$("totals").textContent = active.length + " 个对象　/　" + activeFiles.size + " 个引用文件" +
  (active.length < items.length ? "　/　" + (items.length-active.length) + " 项退出盘点" : "");
$("coverage").textContent = [manifest.coverage,view.basis].filter(Boolean).join("\n");
$("search").oninput = list;
/*__structures.js__*/
setupStructure();
window.onhashchange = () => {
  let id; try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
  if (!id && drawer?.open) drawer.close();
  if (id === selected) { if (id && drawer && !drawer.open) openDrawer(); return; }
  if (items.some(i => i.id === id)) { selected = id; category = null; scope = null; $("search").value = ""; filters(); list(); if (drawer) openDrawer(); }
};
filters(); list();
if (drawer && opening && location.hash) openDrawer();
</script>
</body>
</html>
