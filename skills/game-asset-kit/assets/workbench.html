<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏资产库</title>
<style>
:root{color-scheme:light;--paper:#f6f6f0;--ink:#192d27;--line:#d6dcd1;--muted:#52685c;--accent:#196343;--green:#193c31;--mint:#c8ecaf}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "DM Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #dc961d;outline-offset:2px}
a{color:var(--accent);overflow-wrap:anywhere}h1,h2,h3,p,figure,dl,dd{margin:0}.layout{min-height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr)}
nav{background:var(--green);color:#edf5e9;padding:26px 16px}.brand{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:700;margin:0 4px 45px}
.mark{width:26px;height:26px;border:2px solid var(--mint);border-radius:4px;box-shadow:inset 0 -6px var(--green),inset 0 -8px var(--mint);transform:rotate(-6deg)}
nav h2{font-size:12px;color:#b6cdbd;font-weight:500;margin:0 10px 10px}.filter{display:flex;align-items:center;justify-content:space-between;gap:12px;background:transparent;color:#edf5e9;border:0;border-radius:5px;padding:9px 12px;text-align:left;width:100%}.filter:hover{background:#254f40}.filter[aria-pressed=true]{background:var(--mint);color:#183526;font-weight:700}.filter small{font:12px ui-monospace,monospace}
main{min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px clamp(20px,3vw,48px) 23px;background:#fffef9;border-bottom:1px solid var(--line)}
.mode{font-size:13px;color:var(--accent);font-weight:650}.head h1{font-size:clamp(24px,3vw,40px);letter-spacing:-.055em;line-height:1.3;margin:4px 0 7px}.totals{color:var(--muted);font-size:13px}.find{display:flex;align-items:center;gap:8px;border:1px solid #bdc8bb;background:white;padding:9px 12px;border-radius:6px}.find span{color:var(--muted);font-size:19px}.find input{width:clamp(140px,17vw,260px);max-width:100%;border:0;background:none;min-width:0}.coverage{padding:11px clamp(20px,3vw,48px);color:var(--muted);border-bottom:1px solid var(--line);font-size:13px}.coverage summary{cursor:pointer}.coverage p{max-width:100ch;margin:8px 0;white-space:pre-wrap}
.workspace{display:grid;grid-template-columns:minmax(220px,.84fr) minmax(340px,1.65fr);align-items:start}.inventory{padding:22px clamp(12px,1.8vw,30px)}.inventory header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.inventory h2{font-size:18px}.inventory header span{font-size:13px;color:var(--muted)}.cards{display:grid;gap:7px;max-height:calc(100vh - 231px);min-height:250px;overflow:auto;padding:3px}
.card{display:flex;align-items:center;gap:12px;text-align:left;min-width:0;background:#fffefb;border:1px solid var(--line);border-radius:6px;padding:8px}.card[aria-current=true]{background:#e8f1df;border-color:#598668;box-shadow:inset 3px 0 0 var(--accent)}.card strong,.card small{display:block;overflow-wrap:anywhere}.card strong{font-size:15px}.card small{font-size:12px;color:var(--muted);margin-top:3px}
.thumb{flex:0 0 52px;height:52px;display:grid;place-items:center;background:#edf0e5;border-radius:4px;overflow:hidden;color:#617766;font:600 13px ui-monospace,monospace}.thumb img,.thumb canvas{width:100%;height:100%;object-fit:contain}.detail{min-width:0;padding:24px clamp(20px,3vw,48px) 32px;background:#fffef9;border-left:1px solid var(--line);min-height:calc(100vh - 180px);overflow-wrap:anywhere}.detail h2{font-size:clamp(22px,2vw,31px);letter-spacing:-.04em;margin:4px 0 1px}.id{font:12px ui-monospace,monospace;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{font-size:12px;background:#ecf2e7;border-radius:4px;padding:3px 8px;color:#34573e}.tag.warn{background:#f5e4c6;color:#795319}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-top:18px}.media{height:clamp(158px,24vh,290px);padding:12px;background-color:#ecede5;background-image:linear-gradient(45deg,#e2e6dc 25%,transparent 25%,transparent 75%,#e2e6dc 75%),linear-gradient(45deg,#e2e6dc 25%,transparent 25%,transparent 75%,#e2e6dc 75%);background-position:0 0,7px 7px;background-size:14px 14px;border-radius:5px;display:grid;place-items:center;overflow:hidden}.media img,.media canvas,.media video{width:100%;height:100%;min-height:0;object-fit:contain}.media audio{max-width:100%;width:100%}.error{font-size:12px;color:#704e22}.gallery figcaption{font-size:13px;margin-top:5px;color:var(--muted)}
.detail section{margin-top:20px}.detail h3{font-size:14px;margin-bottom:7px}.ref{padding:8px 0;border-top:1px solid var(--line);font-size:13px}.ref strong{display:block}.ref code{font:12px ui-monospace,monospace;color:var(--muted);display:block}.note{white-space:pre-wrap}.empty{padding:20px 5px;color:var(--muted)}.path{font:13px ui-monospace,monospace}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:1600px){.workspace{grid-template-columns:minmax(360px,1fr) minmax(520px,1.6fr)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1050px){.layout{grid-template-columns:156px minmax(0,1fr)}nav{padding-inline:10px}.brand{font-size:16px}.workspace{grid-template-columns:minmax(200px,.85fr) minmax(300px,1.45fr)}}
@media(max-width:760px){.layout,.workspace{display:block}nav{padding:12px 15px}.brand{margin:0 0 10px}.mark{width:20px;height:20px}nav h2{display:none}#filters{display:flex;gap:4px;overflow:auto}.filter{width:auto;white-space:nowrap;gap:8px}.head{flex-wrap:wrap;padding:18px}.find{width:100%}.find input{width:100%}.inventory{padding:15px}.cards{max-height:245px;min-height:0;grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.thumb{flex-basis:40px;height:40px}.detail{min-height:0;border:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="layout"><nav aria-label="资产分类"><div class="brand"><span class="mark" aria-hidden="true"></span>资产工作台</div><h2>按分类浏览</h2><div id="filters"></div></nav>
<main><header class="head"><div><p class="mode" id="mode"></p><h1 id="title"></h1><p class="totals" id="totals"></p></div><label class="find"><span aria-hidden="true">⌕</span><span class="sr">搜索资产</span><input id="search" type="search" placeholder="搜索名称、场景、来源…" autocomplete="off"></label></header>
<details class="coverage"><summary>盘点范围</summary><p id="coverage"></p></details>
<div class="workspace"><section class="inventory"><header><h2 id="group">全部资产</h2><span id="count" aria-live="polite"></span></header><div id="cards" class="cards"></div></section><article id="detail" class="detail" aria-label="资产详情"></article></div></main></div>
<script id="kit-data" type="application/json">/*__KIT_DATA__*/</script>
<script>
"use strict";
const {root, manifest} = JSON.parse(document.getElementById("kit-data").textContent);
const {items, files} = manifest;
const evidence = {used:"已定位用法", file:"仅发现文件", visual:"画面可见"};
const statusNames = {added:"新增", changed:"变更", unchanged:"未变", removed:"退出盘点", missing:"来源缺失"};
const $ = id => document.getElementById(id);
function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
const assetName = item => item.manual.name || item.name;
const url = path => root + path.split("/").map(encodeURIComponent).join("/");
const mediaType = path => /\.(mp3|m4a|ogg|wav)$/i.test(path) ? "audio" : /\.(mp4|webm|mov)$/i.test(path) ? "video" : "img";
function loadImage(ref, box) {
  const img = new Image();
  img.alt = ref.preview;
  img.loading = "lazy";
  img.onerror = () => box.replaceChildren(el("span","图片未载入","error"));
  if (ref.rect) img.onload = () => {
    const [x,y,w,h] = ref.rect;
    if (x+w > img.naturalWidth || y+h > img.naturalHeight) {
      box.replaceChildren(el("span","裁切超出原图","error"));
      return;
    }
    const scale = Math.min(1, (box.classList.contains("thumb") ? 128 : 1200) / Math.max(w,h));
    const canvas = el("canvas");
    canvas.width = Math.max(1,Math.round(w*scale));
    canvas.height = Math.max(1,Math.round(h*scale));
    canvas.setAttribute("aria-label",ref.preview);
    canvas.getContext("2d").drawImage(img,x,y,w,h,0,0,canvas.width,canvas.height);
    box.replaceChildren(canvas);
  };
  img.src = url(ref.path);
  box.append(img);
}
function reference(ref) {
  const row = el("div",undefined,"ref");
  if (ref.scene) row.append(el("strong",ref.scene));
  if (files[ref.path]) {
    const link = el("a",ref.path,"path");
    link.href = url(ref.path); link.target = "_blank"; link.rel = "noopener";
    row.append(link);
  } else row.append(el("span",ref.path + " · 文件缺失","error"));
  const position = [ref.locator,ref.rect && ("区域 [" + ref.rect.join(", ") + "]")].filter(Boolean);
  if (position.length) row.append(el("code",position.join(" · ")));
  return row;
}
function section(title,...children) {
  const group = el("section");
  group.append(el("h3",title),...children);
  return group;
}
function detail(item) {
  const pane = $("detail");
  pane.replaceChildren();
  if (!item) { pane.append(el("p","没有符合条件的条目。","empty")); return; }
  pane.append(el("p",item.category,"mode"),el("h2",assetName(item)),el("p",item.id,"id"));
  const tags = el("div",undefined,"tags");
  tags.append(el("span",evidence[item.evidence],"tag"),el("span",statusNames[item.status],
    ["missing","removed"].includes(item.status) ? "tag warn" : "tag"));
  pane.append(tags);
  const gallery = el("div",undefined,"gallery");
  for (const ref of item.sources.filter(s => s.preview && files[s.path])) {
    const figure = el("figure"), box = el("div",undefined,"media");
    const type = mediaType(ref.path);
    if (type === "img") loadImage(ref,box);
    else {
      const player = el(type);
      player.src = url(ref.path); player.controls = true; player.preload = "none";
      player.setAttribute("aria-label",ref.preview);
      box.append(player);
    }
    figure.append(box,el("figcaption",ref.preview)); gallery.append(figure);
  }
  if (gallery.childElementCount) pane.append(gallery);
  else pane.append(el("p","此条目可从下方来源定位。","totals"));
  if (item.states?.length) pane.append(section("状态",el("p",item.states.join("　/　"))));
  if (item.uses?.length) {
    const uses = section("使用场景",...item.uses.slice(0,2).map(reference));
    if (item.uses.length > 2) {
      const more = el("details");
      more.append(el("summary","查看其余 " + (item.uses.length-2) + " 处"),...item.uses.slice(2).map(reference));
      uses.append(more);
    }
    pane.append(uses);
  }
  pane.append(section("来源文件",...item.sources.map(reference)));
  if (item.manual.note) pane.append(section("人工备注",el("p",item.manual.note,"note")));
}
let category = null, selected;
try { selected = decodeURIComponent(location.hash.slice(1)); } catch { selected = ""; }
const categories = new Map();
for (const item of items) categories.set(item.category,(categories.get(item.category)||0)+1);
function filters() {
  $("filters").replaceChildren();
  for (const [key,count] of [[null,items.length],...categories]) {
    const button = el("button",undefined,"filter");
    button.append(el("span",key ?? "全部资产"),el("small",count));
    button.setAttribute("aria-pressed",String(key === category));
    button.onclick = () => { category = key; filters(); list(); };
    $("filters").append(button);
  }
}
const searchIndex = new Map(items.map(i => [i.id, [i.id,i.name,assetName(i),i.manual.note,i.category,
  ...(i.states || []),...i.sources.flatMap(s => [s.path,s.locator,s.preview]),
  ...(i.uses || []).flatMap(u => [u.scene,u.path,u.locator])].filter(Boolean).join(" ").toLowerCase()]));
function choose(item) {
  selected = item.id;
  location.hash = encodeURIComponent(selected);
  for (const card of $("cards").children) card.setAttribute("aria-current",String(card.dataset.id === selected));
  detail(item);
  if (matchMedia("(max-width:760px)").matches) $("detail").scrollIntoView({block:"start"});
}
function list() {
  const query = $("search").value.trim().toLowerCase();
  const visible = items.filter(i => (category === null || i.category === category) && searchIndex.get(i.id).includes(query));
  const current = visible.find(i => i.id === selected) || visible[0];
  selected = current?.id;
  $("cards").replaceChildren(); $("group").textContent = category ?? "全部资产";
  $("count").textContent = visible.length + " 项";
  for (const item of visible) {
    const card = el("button",undefined,"card"), thumb = el("span",undefined,"thumb");
    const preview = item.sources.find(s => s.preview && files[s.path] && mediaType(s.path) === "img");
    if (preview) loadImage(preview,thumb);
    else thumb.textContent = item.sources.some(s => s.preview) ? "▷" : "⌘";
    const words = el("span");
    words.append(el("strong",assetName(item)),el("small",item.category + " · " + evidence[item.evidence]));
    card.append(thumb,words); card.dataset.id = item.id;
    card.setAttribute("aria-current",String(item === current));
    card.onclick = () => choose(item); $("cards").append(card);
  }
  detail(current);
}
$("title").textContent = manifest.project;
document.title = manifest.project + " · 资产工作台";
$("mode").textContent = manifest.mode === "ui" ? "游戏 UI Kit" : "游戏资产库";
const active = items.filter(i => i.status !== "removed");
const activeFiles = new Set(active.flatMap(i => [...i.sources,...(i.uses || [])].map(r => r.path)).filter(p => files[p]));
$("totals").textContent = active.length + " 个对象　/　" + activeFiles.size + " 个引用文件" +
  (active.length < items.length ? "　/　" + (items.length-active.length) + " 项退出盘点" : "");
$("coverage").textContent = manifest.coverage;
$("search").oninput = list;
window.onhashchange = () => {
  let id; try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
  if (id === selected) return;
  if (items.some(i => i.id === id)) { selected = id; category = null; $("search").value = ""; filters(); list(); }
};
filters(); list();
</script>
</body>
</html>
